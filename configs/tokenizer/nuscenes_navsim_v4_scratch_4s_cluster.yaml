      train_manifest: data/manifests/navsim_mini_train_4s.jsonl
      val_manifest: data/manifests/navsim_mini_val_4s.jsonl
      train_feature_cache: data/vggt_omega_cache/navsim_mini_front_4s_train_rich
      val_feature_cache: data/vggt_omega_cache/navsim_mini_front_4s_val_rich

navsim_export:

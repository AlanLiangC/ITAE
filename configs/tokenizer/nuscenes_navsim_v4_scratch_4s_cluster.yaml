# data/vggt_omega_cache/, which is ignored by Git.
data:
  sources:
    nuscenes:
      train_manifest: data/manifests/nuscenes_lidar10hz_front_4s_train.jsonl
      val_manifest: data/manifests/nuscenes_lidar10hz_front_4s_val.jsonl
      train_feature_cache: data/vggt_omega_cache/nuscenes_front_4s_train_rich
      val_feature_cache: data/vggt_omega_cache/nuscenes_front_4s_val_rich

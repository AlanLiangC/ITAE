seed: 42

data:
  data_root: data/nuscenes
  image_size: 512

  # Five official CAM_FRONT keyframes at 1 Hz: t = 0, 1, 2, 3, 4 seconds.
  image_source: keyframe  # keyframe | all
  frame_offsets_s: [0.0, 1.0, 2.0, 3.0, 4.0]
  # Official keyframe spacing varies around 0.5 s; 0.25 s is the nearest-keyframe bound.
  max_image_time_error_s: 0.25

  # 40 LiDAR ego poses inside the visual window: (t0, t0+4s], excluding trivial t0.
  trajectory_pose_source: lidar_sweeps  # lidar_sweeps | frame_keyframes
  trajectory_sampling: nearest  # nearest | interpolate
  future_horizon_s: 4.0
  trajectory_hz: 10
  max_trajectory_time_error_s: 0.03
  max_pose_interpolation_gap_s: 0.15  # used only when sampling=interpolate

  # Candidate anchors are official LiDAR/camera keyframes; stride is configurable.
  anchor_stride_s: 0.0  # 0 means use every official keyframe as a candidate anchor
  feature_cache: null
  num_workers: 8

pe:
  model_name: PE-Spatial-B16-512
  checkpoint_path: /home/alan/AlanLiang/Projects/pure_checkpoints/PE-Spatial-B16-512/PE-Spatial-B16-512.pt
  feature_dim: 768
  layer_idx: null
  pool_size: 8
  forward_batch_size: 5
  freeze: true

model:
  # V2 keeps PE patches on an ordered grid and differences the same grid cells.
  model_dim: 256
  latent_dim: 64
  num_action_tokens: 10
  resampled_tokens_per_frame: 32
  num_heads: 8
  encoder_layers: 2
  decoder_layers: 2
  dropout: 0.0
  resampler_type: grid  # grid | query (legacy)
  visual_transition_mode: spatial_difference  # spatial_difference | content_match (legacy)
  decoder_type: direct  # direct avoids the zero-speed dead zone in the old integrator
  max_speed_mps: 35.0
  trajectory_position_scale_m: 50.0

loss:
  reconstruction_weight: 1.0
  dynamics_weight: 0.0 # 0.25
  physical_weight: 0.0
  kl_weight: 0.0
  kl_free_bits: 0.05
  kl_warmup_steps: 10000
  alignment_weight: 1.0
  visual_transition_weight: 0.2
  info_nce_temperature: 0.1
  max_accel_mps2: 5.0
  max_decel_mps2: 8.0
  max_jerk_mps3: 10.0
  max_yaw_rate_rps: 1.2
  # First stabilize the trajectory autoencoder, then smoothly enable visual losses.
  trajectory_pretrain_steps: 500
  visual_ramp_steps: 1000

train:
  resume: auto  # auto/latest | null/false | checkpoint path (e.g. last.pt)
  epochs: 30
  batch_size: 8
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip_norm: 10.0
  precision: bf16
  sample_posterior: false
  log_every: 20
  validate_every: 1
  save_every: 1

tensorboard:
  enabled: true
  log_dir: null  # null -> <training output>/tensorboard
  flush_secs: 30
  evaluation_visualization_items: 8
  evaluation_visualization_every_epochs: 1
  evaluation_visualization_include_images: true
  evaluation_visualization_distinct_scenes: true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-action-tokenizer"
version = "0.2.0"
description = "Vision-aligned continuous action tokenizer for end-to-end driving"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ijson>=3.2",
  "imageio-ffmpeg>=0.4",
  "moviepy==1.0.3",
  "numpy>=1.23",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "safetensors>=0.4",
  "tensorboard>=2.14",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
viz = ["matplotlib>=3.8"]
pe = ["timm==1.0.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
